apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'app.cash.molecule'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.squareup.anvil'
apply plugin: "app.cash.sqldelight"


android {
    compileSdk 36
    defaultConfig {
        applicationId "com.mahozi.sayed.talabiya"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.4.8"
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    namespace 'com.mahozi.sayed.talabiya'
}


dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'com.google.android.material:material:1.13.0'

    def composeBom = platform(libs.compose.bom)
    implementation(composeBom)
    implementation(libs.compose.activity)
    implementation libs.compose.material3
    implementation libs.compose.android
    implementation(libs.compose.preview)
    debugImplementation(libs.compose.tooling)

    testImplementation(libs.assertk)
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation "androidx.test.ext:junit:1.1.5"

    implementation 'com.google.dagger:dagger:2.44'
    kapt 'com.google.dagger:dagger-compiler:2.44'

    implementation "cafe.adriel.voyager:voyager-navigator:1.0.0-rc03"

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.2'

    lintChecks("com.slack.lint.compose:compose-lint-checks:1.4.2")

    implementation("app.cash.sqldelight:android-driver:2.0.0")
    implementation("app.cash.sqldelight:coroutines-extensions:2.0.0")
    testImplementation("app.cash.sqldelight:sqlite-driver:2.0.0")
    testImplementation('org.xerial:sqlite-jdbc:3.40.0.0') {
        // Override the version of sqlite used by sqlite-driver to match Android API 23
        version {
            strictly("3.8.10.2")
        }
    }
}

allprojects {
    configurations.configureEach {
        resolutionStrategy {
            force 'org.xerial:sqlite-jdbc:3.40.0.0'
        }
    }
}

sqldelight {
    databases {
        Database {
            packageName = "com.mahozi.talabiya"
        }
    }
}
