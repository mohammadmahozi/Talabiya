plugins {
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin)
}
apply plugin: 'com.android.application'
apply plugin: 'kotlin-parcelize'
apply plugin: "app.cash.sqldelight"
apply plugin: "dev.zacsweers.metro"

android {
    compileSdk 36
    defaultConfig {
        applicationId "com.mahozi.sayed.talabiya"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            applicationIdSuffix ".debug"
            debuggable true
            resValue "string", "app_name", "Talabiya Debug"
        }
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    namespace 'com.mahozi.sayed.talabiya'
}


dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'com.google.android.material:material:1.13.0'

    def composeBom = platform(libs.compose.bom)
    implementation(composeBom)
    implementation(libs.compose.activity)
    implementation libs.compose.material3
    implementation libs.compose.android
    implementation(libs.compose.preview)
    debugImplementation(libs.compose.tooling)

    implementation(libs.molecule)

    testImplementation(libs.assertk)
    testImplementation(libs.kotlinx.coroutines.test)
    testImplementation(libs.turbine)
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation "androidx.test.ext:junit:1.1.5"

    implementation "cafe.adriel.voyager:voyager-navigator:1.0.0-rc03"

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.2'

    lintChecks("com.slack.lint.compose:compose-lint-checks:1.4.2")

    implementation(libs.sqldelight.driver.android)
    implementation(libs.sqldelight.coroutines)
    testImplementation(libs.sqldelight.driver)
    testImplementation('org.xerial:sqlite-jdbc:3.40.0.0') {
        // Override the version of sqlite used by sqlite-driver to match Android API 23
        version {
            strictly("3.8.10.2")
        }
    }

    implementation(libs.datastore)
}

allprojects {
    configurations.configureEach {
        resolutionStrategy {
            force 'org.xerial:sqlite-jdbc:3.40.0.0'
        }
    }
}

sqldelight {
    databases {
        TalabiyaDatabase {
            packageName = "com.mahozi.talabiya"
            version = 2
        }
    }
}
