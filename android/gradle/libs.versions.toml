[versions]
compileSdk = "36"
minSdk = "23"

kotlin = "2.2.21"
coroutine = "1.7.3"
sqldelight = "2.2.1"


[plugins]
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version = "2026.03.01"}
compose-android = { group = "androidx.compose.ui", name = "ui-android" }
compose-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-activity = "androidx.activity:activity-compose:1.13.0"
compose-lint-checks = { module = "com.slack.lint.compose:compose-lint-checks", version = "1.4.2" }

core-ktx = { module = "androidx.core:core-ktx", version = "1.18.0" }
appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.1" }

junit = { module = "junit:junit", version = "4.13.2" }
ext-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutine" }

assertk = "com.willowtreeapps.assertk:assertk:0.28.1"
runner = { module = "androidx.test:runner", version = "1.7.0" }
turbine = { module = "app.cash.turbine:turbine", version = "1.2.1" }

sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
molecule = "app.cash.molecule:molecule-runtime:2.2.0"

datastore = "androidx.datastore:datastore-preferences:1.2.1"

desugar_jdk_libs = { module = "com.android.tools:desugar_jdk_libs", version = "2.1.5" }

